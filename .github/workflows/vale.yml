name: Vale Lint

on: [push, pull_request]

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: all
          # e2e test/eval fixtures may deliberately contain the prose
          # patterns that Vale flags, so they're excluded from linting. Skill
          # definitions and reference docs are linted like any other prose.
          vale_flags: "--glob=!{**/e2e/**}"
          fail_on_error: false
          reporter: github-pr-review
