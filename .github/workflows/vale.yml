name: Vale Lint

on: [push, pull_request]

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: all
          # Skill/agent definition files use YAML frontmatter that isn't
          # meant as prose (and can crash Vale's frontmatter parser), so
          # they're excluded from linting.
          vale_flags: "--glob=!{**/skills/**}"
          fail_on_error: false # warnings don't fail; errors do
          reporter: github-pr-review
