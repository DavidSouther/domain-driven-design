name: Nightly Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: photostructure/git-ssh-signing-action@v1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}

      - name: Set git identity
        run: |
          git config user.name "Ailly Release Bot"
          git config user.email "davidsouther@gmail.com"

      - name: Configure allowed signers
        run: git config gpg.ssh.allowedSignersFile signing/allowed_signers

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin git-cliff-*/git-cliff

      - name: Run release script
        run: bash .github/scripts/release.sh
