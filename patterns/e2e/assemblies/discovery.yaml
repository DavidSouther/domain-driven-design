name: discovery
model: claude-sonnet-4-6

matrix:
  case:
    - newtype-mixed-ids
    - newtype-vs-evs-order-line
    - configuring-first-log-line
    - emitting-order-placed
    - paired-add-propagator
    - paired-log-handler-success
    - aggregate-vs-unit-of-work
    - parse-vs-type-states
    - aax-interleaved-test
    - bootstrap-thin-adapter
    - builder-many-fields
    - errors-library-failure
    - triangulate-fake-passes
    - bifurcate-plausible-causes
