name: invocation
model: claude-sonnet-4-6

matrix:
  skill:
    - newtype
    - configuring-logging
    - emitting-logs
    - aggregate
    - parse-dont-validate
    - repository
    - arrange-act-assert
    - bootstrap-and-service
    - builder
    - domain-objects
    - errors-typed-untyped
    - triangulate
    - bifurcate
    - type-conversion
    - type-states
    - unit-of-work
    - visibility

prefix:
  - { kind: file,     path: AGENTS.md,                            cache: true }
  - { kind: file,     path: profile.md,                           cache: true }
  - { kind: external, path: ../skills/using-patterns/SKILL.md,    cache: true }
  # Post-consolidation: the leaf skills are now references under using-patterns. Pull
  # the per-pattern reference straight from the real skill tree via an external link,
  # rather than duplicating it through the e2e `skills` symlink.
  - kind: external
    path: "../skills/using-patterns/references/patterns/{{ skill }}.md"
    cache: true

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
