name: invocation
model: claude-sonnet-4-6

# See discovery.yaml for why prefix files are reached through in-jail symlinks
# (`AGENTS.md` -> shared constitution, `skills` -> live plugin skills).

matrix:
  skill:
    - glossary
    - ubiquitous-language
    - domain-model
    - contracts-and-invariants
    - arrow-of-maturity

prefix:
  - { kind: file,     path: ./AGENTS.md,                          cache: true }
  - { kind: file,     path: ./profile.md,                         cache: true }
  - { kind: external, path: ../skills/using-domain/SKILL.md,      cache: true }
  # Post-consolidation: the leaf skills are now references under using-domain. Pull
  # each per-ability reference straight from the real skill tree via an external link,
  # rather than duplicating it through the e2e `skills` symlink.
  - kind: external
    path: "../skills/using-domain/references/{{ skill }}.md"
    cache: true

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
