name: baseline-abilities
# Post-consolidation (developer-plugin consolidation): the falsification arm for the three
# progressive abilities. Mechanically the same cases as evals/invocation-abilities.yaml,
# scored over the no-body baseline run (assemblies/baseline-abilities.yaml). Pairs with
# evals/invocation-abilities.yaml so the comparison matches same-named cases on each side.
cases:
  - name: thinking
    assertions:
      - { type: script, runtime: python, script: { path: evals/scripts/check_thinking.py } }
      - type: judge
        prompt: |
          The response is a debugging analysis, not a fix applied to files. It
          states the root cause specifically (the parser rule is left-recursive,
          so parse_expr calls itself with no base case and recurses forever), and
          gives an ordered list of concrete next steps where each step names the
          outcome it should produce. It does not say "try X and see" and does not
          just rewrite the file for the user.
      - { type: tokens, metric: output, op: "<", value: 5000 }

  - name: refactor
    assertions:
      - { type: script, runtime: python, script: { path: evals/scripts/check_refactor.py } }
      - type: judge
        prompt: |
          The response improves the given code as a post-green refactoring. It
          identifies specific named code smells (the duplicated Bearer-token
          parsing, the "Bearer " magic constant, the long handler) and resolves
          them one at a time without changing behaviour and without adding new
          features or tests. It treats the work as cleanup of existing green
          code, not new development.
      - { type: tokens, metric: output, op: "<", value: 6000 }

  - name: initialize
    assertions:
      - { type: script, runtime: python, script: { path: evals/scripts/check_initialize.py } }
      - type: judge
        prompt: |
          The response sets up the project by scaffolding/validating the layout
          for the chosen toolchain and configuring the four development hooks --
          Format (after editing a file), Check (before running tests), Test
          (after every change), and Lint (after a task completes) -- and confirms
          a clean build. It is a project-setup procedure, not application code.
      - { type: tokens, metric: output, op: "<", value: 5000 }
