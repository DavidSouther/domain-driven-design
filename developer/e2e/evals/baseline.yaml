name: baseline
# Post-consolidation (developer-plugin consolidation): the falsification arm for the
# surviving `ailly` coordinator. Mechanically the same case as evals/invocation.yaml,
# scored over the no-body baseline run (assemblies/baseline.yaml). The five lifecycle
# phases moved to evals/baseline-phases.yaml and the three progressive abilities to
# evals/baseline-abilities.yaml so each baseline-vs-invocation comparison pairs same-named
# cases on each side.
cases:
  - name: ailly
    assertions:
      - { type: script, runtime: python, script: { path: evals/scripts/check_ailly.py } }
      - type: judge
        prompt: |
          The response recognises that the design draft marker has not been
          cleared and therefore refuses to proceed to the next phase. It tells
          the user to review and remove the *Draft* marker before continuing,
          and does NOT write the feature test in this session.
      - { type: tokens, metric: output, op: "<", value: 5000 }
