name: discovery
cases:
  # Vague idea, nothing gathered yet → research, not design (research owns the
  # nothing-gathered niche; design starts once research is cleared).
  - name: research-vs-design
    assertions:
      - { type: text_contains, value: "developer:research" }
      - { type: text_not_contains, value: "developer:design" }

  # Design cleared and its feature test recorded → plan, not the impl loop.
  - name: design-vs-plan
    assertions:
      - { type: text_contains, value: "developer:plan" }
      - { type: text_not_contains, value: "developer:red-green-refactor" }

  # Feature test failing as expected, no steps yet → plan, not the impl loop.
  - name: plan-vs-rgr
    assertions:
      - { type: text_contains, value: "developer:plan" }
      - { type: text_not_contains, value: "developer:red-green-refactor" }

  # Same error after a fix during a TDD cycle → thinking, not loop back to RGR.
  - name: rgr-vs-thinking
    assertions:
      - { type: text_contains, value: "developer:thinking" }
      - { type: text_not_contains, value: "developer:red-green-refactor" }
      - type: judge
        prompt: |
          The answer routes to developer:thinking because the same error
          recurred after a change intended to fix it — a stuck-debugging
          situation. It does not recommend continuing or restarting the
          red-green-refactor loop as the fix for the recurring error.

  # Green code, smells to clean before merge → refactor, not a new RGR step.
  - name: refactor-vs-rgr
    assertions:
      - { type: text_contains, value: "developer:refactor" }
      - { type: text_not_contains, value: "developer:red-green-refactor" }
      - type: judge
        prompt: |
          The answer routes to developer:refactor because the tests are
          already green and the goal is to improve the code without changing
          behaviour. It does not propose starting another red-green-refactor
          implementation step.

  # Paired tidy-vs-finish: (a) → refactor (green mid-build), (b) → cleanup
  # (terminal phase). Restores the cleanup routing coverage the removed
  # is-clean-vs-cleanup pair provided.
  - name: cleanup-vs-refactor
    assertions:
      - { type: text_contains, value: "developer:refactor" }
      - { type: text_contains, value: "developer:cleanup" }
      - type: judge
        prompt: |
          The answer maps question (a) — cleaning up green code mid-build without
          changing behavior — to developer:refactor, and question (b) — finishing
          the whole topic with a final review, extracting the deferred decisions
          into the TASKS file, and preparing the squash merge — to
          developer:cleanup. The two are not swapped.

  # Empty folder, toolchain/layout/hooks to install → initialize, not the
  # session coordinator.
  - name: initialize-vs-ailly
    assertions:
      - { type: text_contains, value: "developer:initialize" }
      - { type: text_not_contains, value: "developer:ailly" }

  # Project already set up; start the gated workflow for a new feature → the
  # session coordinator, not project setup.
  - name: ailly-vs-initialize
    assertions:
      - { type: text_contains, value: "developer:ailly" }
      - { type: text_not_contains, value: "developer:initialize" }

  # Paired bootstrap-vs-per-use: (a) one-time wiring of the team's tracker and
  # docs → configuring-program-management; (b) everyday next-task / write-back →
  # using-program-management. The configure/practice cadence split, not swapped.
  - name: program-management-config-vs-use
    assertions:
      - { type: text_contains, value: "developer:configuring-program-management" }
      - { type: text_contains, value: "developer:using-program-management" }
      - type: judge
        prompt: |
          The answer maps question (a) — the one-time setup that records the
          active tracker, the Epic/feature/bug term mapping, and the doc-system
          target — to developer:configuring-program-management, and question (b)
          — the everyday session work of pulling the next task and writing
          deferred work back to the tracker — to developer:using-program-management.
          The two are not swapped, and it does not route either to
          developer:initialize or developer:ailly.
