name: invocation
# Post-consolidation (developer-plugin consolidation): this suite scores only the `ailly`
# coordinator, the one surviving standalone development-flow skill. The five lifecycle
# phases moved to evals/invocation-phases.yaml and the three progressive abilities
# (thinking, refactor, initialize) to evals/invocation-abilities.yaml -- same checkers and
# judges, scored against their matching baseline arm. Splitting the suites lets each arm
# load its body from the right path while keeping one prompt and one checker per case.
cases:
  - name: ailly
    assertions:
      - { type: script, runtime: python, script: { path: evals/scripts/check_ailly.py } }
      - type: judge
        prompt: |
          The response recognises that the design draft marker has not been
          cleared and therefore refuses to proceed to the next phase. It tells
          the user to review and remove the *Draft* marker before continuing,
          and does NOT write the feature test in this session.
      - { type: tokens, metric: output, op: "<", value: 5000 }
