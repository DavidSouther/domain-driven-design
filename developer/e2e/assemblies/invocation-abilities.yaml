name: invocation-abilities
model: claude-sonnet-4-6

# Post-consolidation (progressive-disclosure, developer-plugin consolidation): the three
# progressive abilities thinking, refactor, and initialize are no longer standalone
# `../skills/<name>/SKILL.md` bodies; they are references the `developer:ailly` coordinator
# consults (../skills/ailly/references/<ability>.md). This suite loads the coordinator
# bootstrap plus exactly one ability reference (the matrix value) -- the same body the
# prior `invocation` suite scored for these abilities, just at its new reference path. The
# prompts and checkers are unchanged (prompts/invocation/<ability>.md,
# evals/scripts/check_<ability>.py), so the gate measures the same behaviour against the
# same baseline arm (baseline-abilities.yaml drops the ability body).
prefix:
  - { kind: file,   path: context/AGENTS.md,                          cache: true }
  - { kind: file,   path: profile.md,                                 cache: true }
  - { kind: external, path: ../skills/ailly/SKILL.md,                 cache: true }
  - kind: external
    path: "../skills/ailly/references/{{ ability }}.md"
    cache: true

matrix:
  ability:
    - thinking
    - refactor
    - initialize

conversation:
  - { role: user, path: "prompts/invocation/{{ ability }}.md" }
  - { role: assistant }
