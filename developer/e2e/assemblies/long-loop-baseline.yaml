name: long-loop-baseline
model: claude-sonnet-4-6

# Falsification arm for the long-loop case: mechanically identical to
# long-loop.yaml with the using-developer, ailly, and long-loop reference bodies
# dropped. AGENTS.md and profile.md stay, so the only difference between the arms
# is the loaded skill/reference — any behaviour gap is attributable to it. Same
# prompt.
prefix:
  - { kind: file, path: context/AGENTS.md, cache: true }
  - { kind: file, path: profile.md,        cache: true }

conversation:
  - { role: user, path: "prompts/invocation/long-loop.md" }
  - { role: assistant }
