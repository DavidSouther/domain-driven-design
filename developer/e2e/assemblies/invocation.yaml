name: invocation
model: claude-sonnet-4-6

# Loads the routing bootstrap plus exactly one skill body (the matrix value).
# Paths are project-rooted; vendor.sh populates ./context/ before assemble.
prefix:
  - { kind: file,   path: context/AGENTS.md,                       cache: true }
  - { kind: file,   path: profile.md,                              cache: true }
  - { kind: system, path: context/skills/using-developer/SKILL.md, cache: true }
  - kind: system
    path: "context/skills/{{ skill }}/SKILL.md"
    cache: true

matrix:
  skill:
    - design
    - feature-test
    - plan
    - red-green-refactor
    - thinking
    - refactor
    - initialize
    - cleanup
    - ailly

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
