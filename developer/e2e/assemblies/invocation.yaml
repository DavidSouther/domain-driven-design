name: invocation
model: claude-sonnet-4-6

# Post-consolidation (Feature C): the five lifecycle phases are no longer standalone
# `../skills/<name>/SKILL.md` bodies; they collapsed into references under the coordinator
# (`../skills/ailly/references/phases/<phase>.md`) entered by argument. This invocation
# matrix therefore carries only the four AUXILIARY skills that survive as standalone
# skills (thinking, refactor, initialize, ailly). The five phase bodies are exercised by
# the sibling `invocation-phases.yaml` suite, which loads them from their new reference
# path. Both suites keep the same prompts and checkers; only the loaded file changed.
#
# Loads the routing bootstrap plus exactly one skill body (the matrix value).
# Paths are project-rooted; vendor.py populates ./context/ before assemble.
prefix:
  - { kind: file,   path: context/AGENTS.md,                       cache: true }
  - { kind: file,   path: profile.md,                              cache: true }
  - { kind: external, path: ../skills/using-developer/SKILL.md, cache: true }
  - kind: external
    path: "../skills/{{ skill }}/SKILL.md"
    cache: true

matrix:
  skill:
    - thinking
    - refactor
    - initialize
    - ailly

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
