name: baseline
model: claude-sonnet-4-6

# Falsification arm for the auxiliary-skill invocation suite: mechanically identical to
# invocation.yaml with the bootstrap + SKILL.md body entries dropped. AGENTS.md and
# profile.md stay, so the only difference between the arms is the loaded skill — any
# behaviour gap is attributable to it. Same prompts, same matrix.
#
# Post-consolidation (Feature C): this arm pairs with `invocation` (the four surviving
# auxiliary skills). The five lifecycle phases moved to their own pair
# (baseline-phases.yaml vs invocation-phases.yaml), so the comparison matches same-named
# cases on each side.
prefix:
  - { kind: file, path: context/AGENTS.md, cache: true }
  - { kind: file, path: profile.md,        cache: true }

matrix:
  skill:
    - thinking
    - refactor
    - initialize
    - ailly

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
