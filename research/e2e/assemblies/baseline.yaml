name: baseline
model: claude-sonnet-4-6

# Post-consolidation (Feature C): mirrors invocation.yaml — the two configuring skills were
# deferred to references and dropped from the matrix, leaving the eight research SOURCE
# leaves so the baseline-vs-invocation comparison pairs same-named cases.
matrix:
  skill:
    - codebase
    - archaeology
    - papers
    - books
    - dependencies
    - domain
    - internal
    - public

prefix:
  - { kind: file, path: ./AGENTS.md,         cache: true }
  - { kind: file, path: ./context/AGENTS.md, cache: true }

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
